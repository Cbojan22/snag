<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Concept 5: Wordmark — pure typography. Lowercase "snag." with a coral period.
       Matches FONT_GEOMETRIC (Futura) in styles.py. -->
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15171F"/>
      <stop offset="100%" stop-color="#0B0C12"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg5)"/>
  <!-- Wordmark centered. Futura with system fallbacks. -->
  <text x="256"
        y="296"
        text-anchor="middle"
        font-family="Futura, 'SF Pro Display', 'Helvetica Neue', Helvetica, sans-serif"
        font-size="172"
        font-weight="700"
        letter-spacing="-6"
        fill="#C8F23F">snag</text>
  <!-- Coral period — the "snag" punctuation -->
  <circle cx="392" cy="296" r="20" fill="#FF7457"/>
  <!-- Thin accent underline -->
  <rect x="156" y="332" width="200" height="6" rx="3" fill="#C8F23F" opacity="0.35"/>
</svg>
